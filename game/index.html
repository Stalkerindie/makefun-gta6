<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Neon Harbor — a 2D top-down open-world crime game. Steal cars, outrun the Harbor Police, and work six story jobs for Mara Voss across Marlowe Bay.">
<meta name="theme-color" content="#0b0e16">
<title>Neon Harbor — Marlowe Bay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e16; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Touch controls (built by touch.js, only on touch devices): a joystick
     bottom-left, action buttons bottom-right. pointer-events none on the
     container so taps on the game canvas still aim and shoot. */
  #touch-ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #stick-base { position: absolute; left: 18px; bottom: 18px; width: 124px; height: 124px; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.25); pointer-events: auto; touch-action: none; }
  #stick-knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.5); }
  #touch-buttons { position: absolute; right: 18px; bottom: 18px; display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
  .touch-btn { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; font-size: 26px; touch-action: none; user-select: none; -webkit-user-select: none; transition: transform .06s ease, background .06s ease; }
  .touch-btn-wide { width: 84px; border-radius: 32px; }
  /* Held buttons shrink and brighten, so a tap that lands always reads as one. */
  .touch-btn.pressed, .touch-btn:active { transform: scale(.9); background: rgba(255, 95, 162, .45); border-color: rgba(255, 255, 255, .7); }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Harbor: drive around Marlowe Bay, steal cars, outrun the police and work jobs for Mara Voss"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
